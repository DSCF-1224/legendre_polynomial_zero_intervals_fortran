name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish-variant:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - branch: default
            fypp_args: ""
          - branch: with_real128
            fypp_args: "-DWITH_REAL128"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install fypp
        run: pip install fypp

      - name: Generate source
        run: |
          mkdir -p /tmp/src
          mkdir -p /tmp/test
          mkdir -p /tmp/example

          fypp ${{ matrix.fypp_args }} \
               src/legendre_polynomial_zero_intervals_fortran.fypp \
               /tmp/src/legendre_polynomial_zero_intervals_fortran.f90

          for f in test/*.fypp; do
            [ "$f" = "test/common.fypp" ] && continue
            fypp ${{ matrix.fypp_args }} "$f" "/tmp/test/$(basename "${f%.fypp}").f90"
          done

          for f in example/*.fypp; do
            fypp ${{ matrix.fypp_args }} "$f" "/tmp/example/$(basename "${f%.fypp}").f90"
          done

      - name: Publish to ${{ matrix.branch }} branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B ${{ matrix.branch }}

          rm -f src/*.fypp
          rm -f test/*.fypp
          rm -f example/*.fypp
          rm -f ./README.fypp

          cp /tmp/src/*.f90     src/
          cp /tmp/test/*.f90    test/
          cp /tmp/example/*.f90 example/

          sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" fpm.toml

          git add -A
          git add -f src/*.f90
          git add -f test/*.f90
          git add -f example/*.f90

          git commit -m "chore: regenerate for ${GITHUB_REF_NAME}"
          git tag "${GITHUB_REF_NAME}+${{ matrix.branch }}"

          git push origin ${{ matrix.branch }} --force
          git push origin "refs/tags/${GITHUB_REF_NAME}+${{ matrix.branch }}"
